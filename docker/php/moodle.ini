; Requisitos e limites adequados ao Moodle 5 + backup/restore de cursos
max_input_vars = 5000
memory_limit = 512M
upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 300
max_input_time = 300
date.timezone = America/Sao_Paulo
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
