services:
  db:
    image: mariadb:11.4
    container_name: inicie_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moodle}
      MYSQL_USER: ${MYSQL_USER:-moodle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-moodle}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-file-per-table=1
      - --innodb-buffer-pool-size=512M
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: moodlehq/moodle-php-apache:8.3
    container_name: inicie_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./moodle:/var/www/html
      - ./moodledata:/var/www/moodledata
      - ./docker/php/moodle.ini:/usr/local/etc/php/conf.d/99-moodle.ini:ro
      - ./scripts:/var/www/scripts:ro
    environment:
      MOODLE_DOCKER_WWWROOT: /var/www/html

  cron:
    image: moodlehq/moodle-php-apache:8.3
    container_name: inicie_cron
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - ./moodle:/var/www/html
      - ./moodledata:/var/www/moodledata
      - ./docker/php/moodle.ini:/usr/local/etc/php/conf.d/99-moodle.ini:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        while true; do
          php /var/www/html/admin/cli/cron.php
          sleep 60
        done

volumes:
  dbdata:
